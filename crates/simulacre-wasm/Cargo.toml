[package]
name = "simulacre-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SIMULACRE engine for the browser: the static (serverless) build of the web UI"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
simulacre-core = { path = "../simulacre-core" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
wasm-bindgen = "0.2"
# rand's OS entropy source in the browser is crypto.getRandomValues.
getrandom = { version = "0.2", features = ["js"] }
