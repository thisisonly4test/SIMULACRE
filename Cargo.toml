[workspace]
resolver = "3"
members = ["crates/simulacre-core", "crates/simulacre-server", "crates/simulacre-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
thiserror = "2"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 4

# Image decoding/resizing is ~30x slower unoptimised; keep dependencies fast
# even in debug builds.
[profile.dev.package."*"]
opt-level = 2

# The in-browser engine (scripts/build-wasm.sh): small over fast.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
